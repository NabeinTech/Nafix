<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Nafix</title>
<style>
  :root {
    --bleu: #1890ff;
    --violet: #722ed1;
    --texte: #1a1a2e;
    --texte-att: #888;
    --fond: #f0f2f5;
    --erreur: #cf1322;
    --erreur-fond: #fff2f0;
    --succes: #237804;
    --succes-fond: #f6ffed;
    --alerte: #d46b08;
    --alerte-fond: #fff7e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fond);
    min-height: 100vh;
    color: var(--texte);
  }
  header {
    background: white;
    border-bottom: 1px solid #eee;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .marque { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--bleu), var(--violet));
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 16px; font-weight: bold;
  }
  .marque h1 { font-size: 16px; margin: 0; }
  .marque p { font-size: 12px; color: var(--texte-att); margin: 0; }
  #bouton-deconnexion {
    border: 1px solid #d9d9d9;
    background: white;
    color: var(--texte);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 28px; }
  .message {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .message.erreur { display: block; background: var(--erreur-fond); color: var(--erreur); border: 1px solid #ffa39e; }
  .bandeau-abonnement {
    display: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .bandeau-abonnement.essai { display: block; background: var(--alerte-fond); color: var(--alerte); border: 1px solid #ffd591; }
  .bandeau-abonnement.actif { display: block; background: var(--succes-fond); color: var(--succes); border: 1px solid #b7eb8f; }
  .bandeau-abonnement.bloque { display: block; background: var(--erreur-fond); color: var(--erreur); border: 1px solid #ffa39e; }
  .grille {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .carte {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 20px;
  }
  .carte .valeur { font-size: 26px; font-weight: 700; }
  .carte .libelle { font-size: 13px; color: var(--texte-att); margin-top: 4px; }
  section.bloc {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 20px;
  }
  section.bloc h2 { font-size: 15px; margin: 0 0 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #f0f0f0; }
  th { color: var(--texte-att); font-weight: 600; }
  .vide { color: var(--texte-att); font-size: 13px; padding: 8px 0; }
  .chargement { text-align: center; padding: 60px 0; color: var(--texte-att); }
</style>
</head>
<body>
  <header>
    <div class="marque">
      <div class="logo">N</div>
      <div>
        <h1 id="nom-utilisateur">Nafix</h1>
        <p id="nom-organisation">—</p>
      </div>
    </div>
    <button id="bouton-deconnexion">Se déconnecter</button>
  </header>

  <main>
    <div id="message" class="message"></div>
    <div id="bandeau-abonnement" class="bandeau-abonnement"></div>
    <div id="chargement" class="chargement">Chargement de vos données…</div>

    <div id="contenu" style="display:none">
      <div class="grille">
        <div class="carte"><div class="valeur" id="v-clients">—</div><div class="libelle">Clients</div></div>
        <div class="carte"><div class="valeur" id="v-produits">—</div><div class="libelle">Produits</div></div>
        <div class="carte"><div class="valeur" id="v-ventes">—</div><div class="libelle">Ventes totales</div></div>
        <div class="carte"><div class="valeur" id="v-ca">—</div><div class="libelle">Chiffre d'affaires</div></div>
        <div class="carte"><div class="valeur" id="v-ventes-jour">—</div><div class="libelle">Ventes aujourd'hui</div></div>
        <div class="carte"><div class="valeur" id="v-ca-jour">—</div><div class="libelle">CA aujourd'hui</div></div>
      </div>

      <section class="bloc">
        <h2>Dernières ventes</h2>
        <table>
          <thead><tr><th>Client</th><th>Montant</th><th>Paiement</th></tr></thead>
          <tbody id="tbody-ventes"></tbody>
        </table>
        <div id="vide-ventes" class="vide" style="display:none">Aucune vente pour l'instant.</div>
      </section>

      <section class="bloc">
        <h2>Alertes de stock</h2>
        <table>
          <thead><tr><th>Produit</th><th>Stock actuel</th><th>Stock minimum</th></tr></thead>
          <tbody id="tbody-stock"></tbody>
        </table>
        <div id="vide-stock" class="vide" style="display:none">Aucune alerte de stock.</div>
      </section>
    </div>
  </main>

<script>
  const session = JSON.parse(sessionStorage.getItem('nafix_session') || 'null')
  if (!session || !session.accessToken) {
    window.location.href = '/login.html'
  }

  const formateurMontant = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 })
  function formaterMontant(n) { return formateurMontant.format(n || 0) + ' FCFA' }

  document.getElementById('nom-utilisateur').textContent = session.utilisateur?.nom || session.utilisateur?.username || 'Nafix'

  async function appelApi(chemin) {
    const reponse = await fetch(chemin, { headers: { Authorization: 'Bearer ' + session.accessToken } })
    if (reponse.status === 401) {
      sessionStorage.removeItem('nafix_session')
      window.location.href = '/login.html'
      throw new Error('session expiree')
    }
    return reponse.json()
  }

  function afficherMessage(texte) {
    const el = document.getElementById('message')
    el.textContent = texte
    el.className = 'message erreur'
  }

  function afficherBandeauAbonnement(abonnement) {
    const bandeau = document.getElementById('bandeau-abonnement')
    if (!abonnement.accesAutorise) {
      bandeau.className = 'bandeau-abonnement bloque'
      bandeau.textContent = "Votre abonnement (" + (abonnement.plan_nom || abonnement.plan_code) + ") n'autorise plus l'accès. Contactez votre administrateur."
    } else if (abonnement.statut === 'essai') {
      bandeau.className = 'bandeau-abonnement essai'
      bandeau.textContent = "Période d'essai en cours — plan " + (abonnement.plan_nom || abonnement.plan_code) + "."
    } else {
      bandeau.className = 'bandeau-abonnement actif'
      bandeau.textContent = "Abonnement actif — plan " + (abonnement.plan_nom || abonnement.plan_code) + "."
    }
  }

  function remplirTableau(corpsId, videId, lignes, construireLigne) {
    const corps = document.getElementById(corpsId)
    const vide = document.getElementById(videId)
    corps.innerHTML = ''
    if (!lignes || lignes.length === 0) {
      vide.style.display = 'block'
      return
    }
    vide.style.display = 'none'
    for (const ligne of lignes) corps.appendChild(construireLigne(ligne))
  }

  async function charger() {
    try {
      const [abonnement, tableauDeBord] = await Promise.all([
        appelApi('/abonnement'),
        appelApi('/dashboard')
      ])

      afficherBandeauAbonnement(abonnement)

      document.getElementById('v-clients').textContent = tableauDeBord.totalClients
      document.getElementById('v-produits').textContent = tableauDeBord.totalProduits
      document.getElementById('v-ventes').textContent = tableauDeBord.totalVentes
      document.getElementById('v-ca').textContent = formaterMontant(tableauDeBord.chiffreAffaire)
      document.getElementById('v-ventes-jour').textContent = tableauDeBord.ventesJour
      document.getElementById('v-ca-jour').textContent = formaterMontant(tableauDeBord.caJour)

      remplirTableau('tbody-ventes', 'vide-ventes', tableauDeBord.dernieresVentes, (vente) => {
        const tr = document.createElement('tr')
        tr.innerHTML = `<td>${vente.client_nom || '—'}</td><td>${formaterMontant(vente.montant_total)}</td><td>${vente.mode_paiement || '—'}</td>`
        return tr
      })

      remplirTableau('tbody-stock', 'vide-stock', tableauDeBord.alertesStock, (produit) => {
        const tr = document.createElement('tr')
        tr.innerHTML = `<td>${produit.nom}</td><td>${produit.stock_actuel}</td><td>${produit.stock_minimum}</td>`
        return tr
      })

      document.getElementById('chargement').style.display = 'none'
      document.getElementById('contenu').style.display = 'block'
    } catch (erreur) {
      if (erreur.message !== 'session expiree') {
        afficherMessage('Impossible de charger vos données. Réessayez dans un instant.')
        document.getElementById('chargement').style.display = 'none'
      }
    }
  }

  document.getElementById('bouton-deconnexion').addEventListener('click', async () => {
    try {
      await fetch('/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken: session.refreshToken })
      })
    } catch (e) {}
    sessionStorage.removeItem('nafix_session')
    window.location.href = '/login.html'
  })

  if (session && session.accessToken) charger()
</script>
</body>
</html>
