<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe — Nafix</title>
<style>
  :root {
    --bleu: #1890ff;
    --violet: #722ed1;
    --texte: #1a1a2e;
    --texte-att: #888;
    --fond: #f0f2f5;
    --erreur: #cf1322;
    --erreur-fond: #fff2f0;
    --succes: #237804;
    --succes-fond: #f6ffed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fond);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .carte {
    width: 100%;
    max-width: 440px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    padding: 40px 36px;
  }
  .logo {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--bleu), var(--violet));
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 24px; font-weight: bold;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--texte); }
  p.sous-titre { color: var(--texte-att); margin: 0 0 28px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--texte); margin-bottom: 6px; }
  .champ { margin-bottom: 16px; }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.15s;
  }
  input:focus { outline: none; border-color: var(--bleu); }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--bleu), var(--violet));
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .message.erreur { display: block; background: var(--erreur-fond); color: var(--erreur); border: 1px solid #ffa39e; }
  .message.succes { display: block; background: var(--succes-fond); color: var(--succes); border: 1px solid #b7eb8f; }
  .lien-retour { text-align: center; margin-top: 20px; font-size: 13px; }
  .lien-retour a { color: var(--bleu); text-decoration: none; }
</style>
</head>
<body>
  <div class="carte">
    <div class="logo">N</div>
    <h1>Nouveau mot de passe</h1>
    <p class="sous-titre" id="sous-titre">Choisissez votre nouveau mot de passe.</p>

    <div id="message" class="message"></div>

    <form id="formulaire">
      <div class="champ">
        <label for="password">Nouveau mot de passe</label>
        <input id="password" name="password" type="password" required minlength="6" maxlength="200" autocomplete="new-password">
      </div>
      <div class="champ">
        <label for="passwordConfirm">Confirmer le mot de passe</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" required minlength="6" maxlength="200" autocomplete="new-password">
      </div>
      <button type="submit" id="bouton">Changer le mot de passe</button>
    </form>

    <div class="lien-retour"><a href="/">Retour à la connexion</a></div>
  </div>

<script>
  const formulaire = document.getElementById('formulaire')
  const bouton = document.getElementById('bouton')
  const messageEl = document.getElementById('message')
  const token = new URLSearchParams(window.location.search).get('token')

  function afficherMessage(texte, type) {
    messageEl.textContent = texte
    messageEl.className = 'message ' + type
  }

  if (!token) {
    document.getElementById('sous-titre').textContent = 'Lien invalide.'
    formulaire.style.display = 'none'
    afficherMessage('Ce lien de réinitialisation est invalide. Demandez-en un nouveau depuis la page "Mot de passe oublié".', 'erreur')
  }

  formulaire.addEventListener('submit', async (evenement) => {
    evenement.preventDefault()
    messageEl.className = 'message'

    const donnees = Object.fromEntries(new FormData(formulaire).entries())
    if (donnees.password !== donnees.passwordConfirm) {
      afficherMessage('Les mots de passe ne correspondent pas.', 'erreur')
      return
    }

    bouton.disabled = true
    bouton.textContent = 'Changement en cours…'
    try {
      const reponse = await fetch('/auth/reinitialiser-mot-de-passe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: donnees.password })
      })
      const resultat = await reponse.json()

      if (!reponse.ok) {
        afficherMessage(resultat.erreur || 'Une erreur est survenue.', 'erreur')
        return
      }

      afficherMessage('✅ Mot de passe changé ! Vous pouvez maintenant vous connecter.', 'succes')
      formulaire.style.display = 'none'
    } catch (erreur) {
      afficherMessage('Impossible de contacter le serveur. Réessayez dans un instant.', 'erreur')
    } finally {
      bouton.disabled = false
      bouton.textContent = 'Changer le mot de passe'
    }
  })
</script>
</body>
</html>
