<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Nafix</title>
<style>
  :root {
    --bleu: #1890ff;
    --violet: #722ed1;
    --texte: #1a1a2e;
    --texte-att: #888;
    --fond: #f0f2f5;
    --erreur: #cf1322;
    --erreur-fond: #fff2f0;
    --succes: #237804;
    --succes-fond: #f6ffed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fond);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .carte {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    padding: 40px 36px;
  }
  .logo {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--bleu), var(--violet));
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 24px; font-weight: bold;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--texte); }
  p.sous-titre { color: var(--texte-att); margin: 0 0 28px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--texte); margin-bottom: 6px; }
  .champ { margin-bottom: 16px; }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.15s;
  }
  input:focus { outline: none; border-color: var(--bleu); }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--bleu), var(--violet));
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .message.erreur { display: block; background: var(--erreur-fond); color: var(--erreur); border: 1px solid #ffa39e; }
  .lien-retour { text-align: center; margin-top: 20px; font-size: 13px; }
  .lien-retour a { color: var(--bleu); text-decoration: none; }
</style>
</head>
<body>
  <div class="carte">
    <div class="logo">N</div>
    <h1>Connexion</h1>
    <p class="sous-titre">Accédez à votre organisation Nafix.</p>

    <div id="message" class="message"></div>

    <form id="formulaire">
      <div class="champ">
        <label for="username">Identifiant</label>
        <input id="username" name="username" required maxlength="100" autocomplete="username">
      </div>
      <div class="champ">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required maxlength="200" autocomplete="current-password">
      </div>
      <button type="submit" id="bouton">Se connecter</button>
    </form>

    <div class="lien-retour">Pas encore de compte ? <a href="/signup.html">Créer mon organisation</a></div>
  </div>

<script>
  const formulaire = document.getElementById('formulaire')
  const bouton = document.getElementById('bouton')
  const messageEl = document.getElementById('message')

  function afficherMessage(texte) {
    messageEl.textContent = texte
    messageEl.className = 'message erreur'
  }

  formulaire.addEventListener('submit', async (evenement) => {
    evenement.preventDefault()
    messageEl.className = 'message'

    const donnees = Object.fromEntries(new FormData(formulaire).entries())
    bouton.disabled = true
    bouton.textContent = 'Connexion en cours…'
    try {
      const reponse = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: donnees.username, password: donnees.password })
      })
      const resultat = await reponse.json()

      if (!reponse.ok) {
        afficherMessage(resultat.erreur || 'Une erreur est survenue.')
        return
      }

      sessionStorage.setItem('nafix_session', JSON.stringify(resultat))
      window.location.href = '/dashboard.html'
    } catch (erreur) {
      afficherMessage('Impossible de contacter le serveur. Réessayez dans un instant.')
    } finally {
      bouton.disabled = false
      bouton.textContent = 'Se connecter'
    }
  })
</script>
</body>
</html>
